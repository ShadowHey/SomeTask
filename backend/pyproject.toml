[project]
name = "audio-notes-backend"
version = "0.1.0"
description = "Audio Notes Platform — FastAPI backend"
requires-python = ">=3.9"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",

    # Background jobs
    "arq>=0.26,<1",

    # Supabase Client
    "supabase>=2.0,<3",

    # HTTP client for external APIs
    "httpx>=0.27,<1",

    # AI / Summarization
    "google-genai>=1.0,<2",

    # Validation & settings
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",

    # Logging
    "structlog>=24,<26",

    # Audio processing (for duration detection and chunking)
    "ffmpeg-python>=0.2,<1",
    "static-ffmpeg>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "factory-boy>=3.3,<4",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# FastAPI uses Depends/Query in function defaults by design.
# The local runtime is Python 3.9; Optional[] avoids Pydantic/SQLAlchemy
# evaluating Python 3.10 union syntax at runtime.
ignore = ["B008", "E501", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
include = ["app*"]
